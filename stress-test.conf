# Stress Testing Configuration
# This file contains configuration for the comprehensive stress testing suite

# Test durations (in seconds)
QUICK_TEST_DURATION=30
FULL_TEST_DURATION=60
ENDURANCE_TEST_DURATION=1800

# Load levels for testing
QUICK_RPS_LEVELS="1 5 10 25 50"
FULL_RPS_LEVELS="1 5 10 25 50 100 200 500 1000 2000"

# Memory profiling settings
MEMORY_SAMPLING_INTERVAL=2
MEMORY_LEAK_DETECTION_SAMPLES=60

# MQTT testing configuration
MQTT_BROKER_HOST=localhost
MQTT_BROKER_PORT=1883
MQTT_TEST_TOPICS="Parkir/1 Parkir/2"

# Docker configuration for testing
MQTT_DOCKER_IMAGE=eclipse-mosquitto:latest
TESTING_NETWORK=parking-iot-test

# Results directories
STRESS_TEST_RESULTS_DIR=stress-test-results
MEMORY_PROFILING_DIR=memory-profiling-results
LOAD_SCENARIOS_DIR=load-test-scenarios
PERFORMANCE_COMPARISON_DIR=performance-comparison

# Performance scoring weights
THROUGHPUT_WEIGHT=0.30
LATENCY_WEIGHT=0.25
MEMORY_WEIGHT=0.25
STABILITY_WEIGHT=0.20

# Resource monitoring thresholds
MAX_MEMORY_MB=1000
MAX_CPU_PERCENT=90
MAX_CONNECTIONS=2000
MAX_FILE_DESCRIPTORS=10000

# Test environment validation
MIN_DISK_SPACE_GB=5
MIN_MEMORY_GB=4
REQUIRED_TOOLS="wrk curl jq docker bc"
OPTIONAL_TOOLS="python3 valgrind pmap htop"

# Reporting configuration
GENERATE_GRAPHS=true
INCLUDE_RAW_DATA=true
COMPRESS_RESULTS=false
UPLOAD_TO_S3=false

# CI/CD integration
FAIL_ON_PERFORMANCE_REGRESSION=false
PERFORMANCE_REGRESSION_THRESHOLD=10
MEMORY_INCREASE_THRESHOLD=20

# Documentation
GENERATE_TEST_DOCS=true
INCLUDE_METHODOLOGY=true
INCLUDE_RECOMMENDATIONS=true