name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-go:
    name: Build Go Binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          
      - name: Build Go binary
        run: |
          go mod tidy
          CGO_ENABLED=0 GOOS=linux go build -a -ldflags '-extldflags "-static"' -o parking-iot-go main.go
          chmod +x parking-iot-go
          
      - name: Upload Go binary
        uses: actions/upload-artifact@v4
        with:
          name: parking-iot-go-linux
          path: parking-iot-go

  build-rust:
    name: Build Rust Binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-unknown-linux-musl
          
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
        
      - name: Build Rust binary
        run: |
          cargo build --release --target x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release/parking-iot-rust .
          chmod +x parking-iot-rust
          
      - name: Upload Rust binary
        uses: actions/upload-artifact@v4
        with:
          name: parking-iot-rust-linux
          path: parking-iot-rust

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-go, build-rust]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Go binary
        uses: actions/download-artifact@v4
        with:
          name: parking-iot-go-linux
          
      - name: Download Rust binary
        uses: actions/download-artifact@v4
        with:
          name: parking-iot-rust-linux
          
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            parking-iot-go
            parking-iot-rust
          body: |
            ## Parking IoT Management System Release
            
            This release includes pre-built binaries for both Go and Rust implementations:
            
            ### 🐹 Go Implementation
            - **Binary**: `parking-iot-go`
            - **Memory Usage**: ~13 MB runtime
            - **Features**: MQTT + WebSocket + Docker support
            
            ### 🦀 Rust Implementation  
            - **Binary**: `parking-iot-rust`
            - **Memory Usage**: ~8-12 MB runtime
            - **Features**: High-performance async + Zero-cost abstractions
            
            ### 🚀 Quick Start
            ```bash
            # Download and run Go version
            chmod +x parking-iot-go
            ./parking-iot-go
            
            # Download and run Rust version
            chmod +x parking-iot-rust
            ./parking-iot-rust
            ```
            
            Both applications serve the parking management interface at http://localhost:3000
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build Go Docker image
        run: |
          docker build -t parking-iot-go:latest .
          
      - name: Build Rust Docker image
        run: |
          docker build -f Dockerfile.rust -t parking-iot-rust:latest .